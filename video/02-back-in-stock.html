<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted marketing/film page for use case: back-in-stock notification (scene 2).
       Reachable only by direct URL; not linked from the shop, not indexed. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Shopler — Uitverkocht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Shopler design tokens (single source of truth for colour/spacing/type). -->
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* Compact component CSS — tokens only, mirrors the shop's own components. */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);
      font-size:var(--text-base);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%}
    .wrap{max-width:var(--container);margin:0 auto;padding:0 var(--space-6)}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

    /* ---------- Header (sticky glass) ---------- */
    .hdr{position:sticky;top:0;z-index:40;background:var(--glass);
      -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line)}
    .hdr__row{display:flex;align-items:center;gap:var(--space-6);height:64px}
    .brand{display:inline-flex;align-items:center;gap:var(--space-3);flex:0 0 auto}
    .brand svg{height:30px;width:auto;display:block}
    .brand .wm{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--text-lg);
      letter-spacing:var(--track-tight);color:var(--ink);line-height:1}
    .nav{display:flex;gap:var(--space-6);flex:1;font-size:var(--text-sm)}
    .nav a{padding:var(--space-2) 0;border-bottom:2px solid transparent;text-transform:uppercase;
      letter-spacing:var(--track-caps);color:var(--ink-soft)}
    .nav a.is-sale{color:var(--accent)}
    .hdr__actions{display:flex;align-items:center;gap:var(--space-4);flex:0 0 auto}
    .lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
    .lang button{background:transparent;border:0;padding:var(--space-1) var(--space-3);font-size:var(--text-xs);
      font-weight:var(--w-semibold);text-transform:uppercase;color:var(--stone-600);cursor:pointer}
    .lang button.is-active{background:var(--ink);color:var(--paper)}
    .icon-btn{position:relative;background:transparent;border:0;display:flex;align-items:center;padding:var(--space-1)}
    .icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
    .count{position:absolute;top:-6px;right:-8px;background:var(--accent);color:var(--accent-contrast);
      font-size:10px;font-family:var(--font-mono);min-width:16px;height:16px;border-radius:var(--r-pill);
      display:flex;align-items:center;justify-content:center;padding:0 4px}

    /* ---------- Breadcrumb ---------- */
    .breadcrumb{font-size:var(--text-sm);color:var(--stone-600);padding:var(--space-6) 0 0}

    /* ---------- Media block with graceful placeholder ---------- */
    .media{position:relative;aspect-ratio:3/4;background:var(--surface-sunken);
      border-radius:var(--r);overflow:hidden}
    .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .media .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;
      align-items:center;justify-content:center;text-align:center;padding:var(--space-6);
      background:var(--accent-tint);color:var(--stone-600)}
    .media .ph b{font-size:var(--text-xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--stone-400)}
    .media .ph span{font-family:var(--font-display);font-weight:var(--w-semibold);color:var(--ink-soft)}
    .pdp.is-sold .media{filter:saturate(.92)}
    .soldout-flag{position:absolute;top:var(--space-3);left:var(--space-3);z-index:2;
      font-size:var(--text-xs);letter-spacing:var(--track-caps);text-transform:uppercase;font-weight:var(--w-semibold);
      color:var(--stone-600);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:var(--r-pill)}

    /* ---------- PDP ---------- */
    .pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--space-12);padding-top:var(--space-6)}
    .pdp__gallery{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
    .pdp__brand{font-size:var(--text-sm);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--stone-600)}
    .pdp__info h1{font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-snug);
      font-size:var(--text-xl);margin:var(--space-2) 0}
    .pdp__desc{color:var(--ink-soft);margin:var(--space-3) 0 var(--space-5);max-width:44ch}
    .pdp__colour{font-size:var(--text-sm);color:var(--ink-soft);margin:var(--space-4) 0}
    .pdp__colour b{color:var(--ink);font-weight:var(--w-semibold)}
    .stock{font-size:var(--text-sm);margin:var(--space-4) 0 0;font-weight:var(--w-semibold);letter-spacing:var(--track-caps);text-transform:uppercase}
    .stock--in{color:var(--success)} .stock--low{color:var(--accent)} .stock--sold{color:var(--accent)}
    .meta{border-top:1px solid var(--line);margin-top:var(--space-6);padding-top:var(--space-6);font-size:var(--text-sm)}
    .meta dl{display:grid;grid-template-columns:130px 1fr;gap:var(--space-2) var(--space-4);margin:0;color:var(--ink-soft)}
    .meta dt{color:var(--stone-400)}

    /* ---------- Sizes ---------- */
    .sizes{margin:var(--space-5) 0}
    .sizes__label{display:flex;justify-content:space-between;font-size:var(--text-sm);color:var(--ink-soft);margin-bottom:var(--space-3)}
    .sizes__note{color:var(--accent);font-weight:var(--w-semibold)}
    .sizes__opts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
    .size-opt{min-width:46px;padding:var(--space-2) var(--space-4);border:1px solid var(--stone-300);
      border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:var(--text-sm);cursor:default}
    .size-opt.is-out{color:var(--stone-400);border-color:var(--line);background:var(--surface-sunken);
      text-decoration:line-through;text-decoration-thickness:1px}

    /* ---------- Buttons ---------- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
      border:1px solid var(--accent);background:var(--accent);color:var(--accent-contrast);
      padding:var(--space-3) var(--space-6);border-radius:var(--r-pill);font-family:var(--font-sans);
      font-size:var(--text-sm);font-weight:var(--w-semibold);letter-spacing:var(--track-caps);
      text-transform:uppercase;cursor:pointer}
    .btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--stone-400);border-color:var(--stone-400)}
    .btn--block{width:100%}

    /* ---------- Back-in-stock notify panel (the scene-2 moment) ---------- */
    .notify{margin-top:var(--space-6);border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--surface);box-shadow:var(--shadow-sm);padding:var(--space-6);
      opacity:0;transform:translateY(14px);pointer-events:none;
      transition:opacity 1s var(--ease),transform 1s var(--ease)}
    .notify.is-in{opacity:1;transform:none;pointer-events:auto}
    .notify__eyebrow{font-size:var(--text-xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--accent);
      display:inline-flex;align-items:center;gap:var(--space-2)}
    .notify__eyebrow svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.7}
    .notify h2{font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-snug);
      font-size:var(--text-lg);margin:var(--space-2) 0 var(--space-2)}
    .notify p.lead{color:var(--ink-soft);font-size:var(--text-sm);margin:0 0 var(--space-5);max-width:46ch}
    .notify form{display:flex;gap:var(--space-3);flex-wrap:wrap}
    .notify input[type=email]{flex:1;min-width:200px;padding:var(--space-3) var(--space-4);border:1px solid var(--stone-300);
      border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:var(--text-sm)}
    .notify input[type=email]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
    .notify .err{color:var(--accent);font-size:var(--text-xs);min-height:1em;margin:var(--space-3) 0 0}
    .notify__privacy{color:var(--stone-400);font-size:var(--text-xs);margin:var(--space-3) 0 0}
    .notify__done{display:none;align-items:flex-start;gap:var(--space-3)}
    .notify__done .tick{flex:0 0 auto;width:38px;height:38px;border-radius:var(--r-pill);background:var(--success-tint);
      display:flex;align-items:center;justify-content:center}
    .notify__done .tick svg{width:20px;height:20px;stroke:var(--success);fill:none;stroke-width:2}
    .notify__done p{margin:0;color:var(--ink)}
    .notify__done p b{font-family:var(--font-display);font-weight:var(--w-semibold);display:block;font-size:var(--text-md)}
    .notify.is-done .notify__form{display:none}
    .notify.is-done .notify__done{display:flex}

    @media (prefers-reduced-motion:reduce){ .notify{transition:none!important} }

    /* ---------- Responsive ---------- */
    @media(max-width:760px){
      .nav{display:none}
      .pdp{grid-template-columns:1fr;gap:var(--space-8)}
      .pdp__gallery{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <div class="wrap"><div class="hdr__row">
      <a class="brand" href="#" aria-label="Shopler home">
        <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="1.5" y="1.5" width="37" height="37" rx="12" fill="var(--accent)"/>
          <path d="M25.5 14.2c-1.1-1.5-3-2.4-5.4-2.4-3.3 0-5.6 1.7-5.6 4.3 0 2.5 1.9 3.6 5 4.2 2.7.5 3.7 1 3.7 2.2 0 1.2-1.2 2-3.1 2-2 0-3.4-.8-4.4-2.2"
            fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="wm">Shopler</span>
      </a>
      <nav class="nav" id="nav" aria-label="Hoofdmenu">
        <a href="#" id="nav-women">Dames</a>
        <a href="#" id="nav-men">Heren</a>
        <a href="#" id="nav-acc">Accessoires</a>
        <a href="#" id="nav-sale" class="is-sale">Sale</a>
      </nav>
      <div class="hdr__actions">
        <div class="lang" id="lang" role="group" aria-label="Taal">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="nl" class="is-active" aria-pressed="true">NL</button>
        </div>
        <button class="icon-btn" id="bag" aria-label="Winkelmand">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="count">1</span>
        </button>
      </div>
    </div></div>
  </header>

  <main class="wrap">
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <section id="pdp" class="pdp" aria-label="Productpagina">
      <div class="pdp__gallery" id="gallery"><!-- built once (images are language-independent) --></div>
      <div class="pdp__info" id="info"><!-- re-rendered per language --></div>
    </section>
  </main>

  <script>
  (function () {
    /* ==== Config — featured product & default language =============== */
    var HERO_SKU  = "KE-M-007";      // genuinely out of stock in the feed
    var FORCE_SOLD_OUT = true;       // always show sold-out for the film, even if restocked
    var DEFAULT_LANG = "nl";         // "nl" | "en" — which toggle is active on load
    /* ================================================================= */

    // All UI copy per language. `low(n)` builds the low-stock line.
    var COPY = {
      nl: {
        nav:{women:"Dames",men:"Heren",acc:"Accessoires",sale:"Sale"},
        colour:"Kleur", size:"Maat", sizeOut:"Niet op voorraad",
        addToBag:"In winkelmand", soldBtn:"Uitverkocht", soldFlag:"Uitverkocht",
        inStock:"Op voorraad", low:function(n){return "Nog maar "+n+" beschikbaar";}, sold:"Uitverkocht",
        desc:"Bewust gemaakt, om te dragen — niet alleen om te zien.",
        material:"Materiaal", season:"Seizoen",
        seasons:{AW:"Herfst / Winter",SS:"Lente / Zomer",All:"Alle seizoenen"},
        notifyEyebrow:"Voorraadmelding",
        notifyHeadline:"Weer op voorraad? Ik laat het je weten.",
        notifyText:"Vul je e-mailadres in — je krijgt automatisch bericht zodra dit item weer beschikbaar is. Zo hoef je niet zelf terug te komen om te kijken.",
        notifyButton:"Houd me op de hoogte", notifyPlaceholder:"E-mailadres",
        notifyErr:"Vul een geldig e-mailadres in.",
        notifyOk:"Gelukt, je staat op de lijst.", notifyOkSub:"Je krijgt een e-mail zodra dit item weer op voorraad is.",
        notifyPrivacy:"Geen spam. Alleen een berichtje als dit item terug is.",
        aria:{menu:"Hoofdmenu",lang:"Taal",bag:"Winkelmand",product:"Productpagina",notify:"Voorraadmelding"},
        title:"Shopler — Uitverkocht"
      },
      en: {
        nav:{women:"Women",men:"Men",acc:"Accessories",sale:"Sale"},
        colour:"Colour", size:"Size", sizeOut:"Out of stock",
        addToBag:"Add to bag", soldBtn:"Sold out", soldFlag:"Sold out",
        inStock:"In stock", low:function(n){return "Only "+n+" left";}, sold:"Sold out",
        desc:"Considered essentials, made to be worn — not just seen.",
        material:"Material", season:"Season",
        seasons:{AW:"Autumn / Winter",SS:"Spring / Summer",All:"All season"},
        notifyEyebrow:"Back in stock",
        notifyHeadline:"Back in stock? I'll let you know.",
        notifyText:"Leave your email — we'll message you automatically as soon as this item is available again. No need to keep checking back yourself.",
        notifyButton:"Notify me", notifyPlaceholder:"Email address",
        notifyErr:"Please enter a valid email address.",
        notifyOk:"Done — you're on the list.", notifyOkSub:"We'll email you as soon as this item is back in stock.",
        notifyPrivacy:"No spam. Just a note when this item returns.",
        aria:{menu:"Main menu",lang:"Language",bag:"Bag",product:"Product page",notify:"Back-in-stock alert"},
        title:"Shopler — Sold out"
      }
    };
    var LANG_CODE = { nl: "nl-NL", en: "en-GB" };
    var CAT = {
      nl:{Women:"Dames",Men:"Heren",Accessories:"Accessoires",Sale:"Sale"},
      en:{Women:"Women",Men:"Men",Accessories:"Accessories",Sale:"Sale"}
    };
    var SIZES = ["XS","S","M","L","XL"];

    var byLang = { nl:{}, en:{} };            // {lang: {id: feedRow}}
    var state = { lang: DEFAULT_LANG, revealed:false, done:false };

    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c];});}
    function product(lang){ return byLang[lang][HERO_SKU] || byLang[lang==="nl"?"en":"nl"][HERO_SKU] || null; }
    function soldOut(p){ return FORCE_SOLD_OUT || !p.in_stock || !(p.stock>0); }

    // Gallery is language-independent (same images per SKU) — build it once.
    function renderGallery(p){
      var g = document.getElementById("gallery");
      if (!p){ g.innerHTML = cell(null,HERO_SKU) + cell(null,HERO_SKU); return; }
      var flag = soldOut(p) ? '<span class="soldout-flag" data-sold-flag></span>' : "";
      g.innerHTML =
        '<div class="media">' + flag + imgCell(p,"lifestyle") + '</div>' +
        '<div class="media">' + imgCell(p,"image") + '</div>';
      if (soldOut(p)) document.getElementById("pdp").classList.add("is-sold");
    }
    function imgCell(p,which){
      var src = which==="lifestyle" ? p.image_lifestyle : p.image;
      var ph = '<div class="ph"><b>'+esc(p.brand)+'</b><span>'+esc(p.name)+'</span></div>';
      return ph + (src ? '<img src="'+esc(src)+'" alt="'+esc(p.name)+'" onerror="this.style.display=\'none\'">' : "");
    }
    function cell(p,sku){ return '<div class="media"><div class="ph"><b></b><span>'+esc(sku)+'</span></div></div>'; }

    function stockLine(p,c){
      if (soldOut(p)) return {txt:c.sold, cls:"stock--sold"};
      if (p.stock>0 && p.stock<=3) return {txt:c.low(p.stock), cls:"stock--low"};
      return {txt:c.inStock, cls:"stock--in"};
    }

    // Info column (incl. notify) — re-rendered on language change.
    function renderInfo(lang){
      var c = COPY[lang], p = product(lang), info = document.getElementById("info");
      if (!p){ info.innerHTML = '<div class="pdp__brand"></div><h1>'+esc(HERO_SKU)+'</h1>'; return; }
      var sold = soldOut(p), st = stockLine(p,c);
      var sizeOpts = SIZES.map(function(s){
        return '<button class="size-opt'+(sold?" is-out":"")+'" type="button" tabindex="-1"'+
          (sold?' aria-disabled="true"':"")+'>'+esc(s)+'</button>';
      }).join("");
      info.innerHTML =
        '<div class="pdp__brand">'+esc(p.brand)+'</div>' +
        '<h1>'+esc(p.name)+'</h1>' +
        '<p class="pdp__desc">'+esc(c.desc)+'</p>' +
        '<div class="pdp__colour">'+esc(c.colour)+': <b>'+esc(p.color)+'</b></div>' +
        '<div class="sizes">' +
          '<div class="sizes__label"><span>'+esc(c.size)+'</span>'+
            (sold?'<span class="sizes__note">'+esc(c.sizeOut)+'</span>':'')+'</div>' +
          '<div class="sizes__opts">'+sizeOpts+'</div>' +
        '</div>' +
        '<button class="btn btn--block" type="button"'+(sold?" disabled":"")+'>'+esc(sold?c.soldBtn:c.addToBag)+'</button>' +
        '<div class="stock '+st.cls+'">'+esc(st.txt)+'</div>' +
        (sold ? notifyHTML(c) : "") +
        '<div class="meta"><dl>' +
          '<dt>'+esc(c.material)+'</dt><dd>'+esc(p.material)+'</dd>' +
          '<dt>'+esc(c.season)+'</dt><dd>'+esc((c.seasons[p.season]||p.season||""))+'</dd>' +
        '</dl></div>';
      if (sold) { setupNotify(c); restoreNotifyState(); }
    }

    function notifyHTML(c){
      return '<section class="notify" id="notify" aria-label="'+esc(c.aria.notify)+'">' +
        '<div class="notify__form">' +
          '<span class="notify__eyebrow">' +
            '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>' +
            esc(c.notifyEyebrow)+'</span>' +
          '<h2>'+esc(c.notifyHeadline)+'</h2>' +
          '<p class="lead">'+esc(c.notifyText)+'</p>' +
          '<form id="notify-form" novalidate>' +
            '<label class="sr-only" for="notify-email">'+esc(c.notifyPlaceholder)+'</label>' +
            '<input id="notify-email" type="email" name="email" placeholder="'+esc(c.notifyPlaceholder)+'" autocomplete="email" required aria-describedby="notify-err">' +
            '<button class="btn" type="submit">'+esc(c.notifyButton)+'</button>' +
          '</form>' +
          '<p class="err" id="notify-err" role="alert"></p>' +
          '<p class="notify__privacy">'+esc(c.notifyPrivacy)+'</p>' +
        '</div>' +
        '<div class="notify__done" aria-live="polite">' +
          '<span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>' +
          '<p><b>'+esc(c.notifyOk)+'</b><span>'+esc(c.notifyOkSub)+'</span></p>' +
        '</div>' +
      '</section>';
    }

    function setupNotify(c){
      var form = document.getElementById("notify-form");
      if (!form) return;
      var box = document.getElementById("notify");
      var input = document.getElementById("notify-email");
      var err = document.getElementById("notify-err");
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var val = input.value.trim();
        var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val); // front-end only; nothing is sent
        if (!ok){ err.textContent = c.notifyErr; input.focus(); return; }
        err.textContent = ""; state.done = true; box.classList.add("is-done");
      });
    }

    // Reapply reveal/submitted state after a re-render (no re-animation on toggle).
    function restoreNotifyState(){
      var box = document.getElementById("notify");
      if (!box) return;
      if (state.done) box.classList.add("is-done");
      if (state.revealed){
        box.style.transition = "none"; box.classList.add("is-in");
        void box.offsetWidth; box.style.transition = "";
      }
    }

    function renderChrome(lang){
      var c = COPY[lang];
      document.documentElement.lang = lang;
      document.title = c.title;
      document.getElementById("nav-women").textContent = c.nav.women;
      document.getElementById("nav-men").textContent = c.nav.men;
      document.getElementById("nav-acc").textContent = c.nav.acc;
      document.getElementById("nav-sale").textContent = c.nav.sale;
      document.getElementById("nav").setAttribute("aria-label", c.aria.menu);
      document.getElementById("lang").setAttribute("aria-label", c.aria.lang);
      document.getElementById("bag").setAttribute("aria-label", c.aria.bag);
      document.getElementById("pdp").setAttribute("aria-label", c.aria.product);
      // sold-out flag on the gallery (built once, so its text is set per language here)
      var flagEl = document.querySelector(".soldout-flag");
      if (flagEl) flagEl.textContent = c.soldFlag;
      // keep the gallery placeholder label (shown only if an image fails) in the current language
      var pg = product(lang);
      if (pg) [].forEach.call(document.querySelectorAll("#gallery .ph span"), function(sp){ sp.textContent = pg.name; });
      // breadcrumb from feed category/subcategory, localised category label
      var p = product(lang);
      var cat = p ? (CAT[lang][p.category] || p.category || "") : "";
      document.getElementById("breadcrumb").textContent = p ? [cat, p.subcategory].filter(Boolean).join(" / ") : "";
      // active toggle
      [].forEach.call(document.querySelectorAll("#lang button"), function(b){
        var on = b.getAttribute("data-lang") === lang;
        b.classList.toggle("is-active", on);
        if (on) b.setAttribute("aria-pressed","true"); else b.removeAttribute("aria-pressed");
      });
    }

    function applyLang(lang){ state.lang = lang; renderChrome(lang); renderInfo(lang); }

    function init(){
      // Toggle wiring
      [].forEach.call(document.querySelectorAll("#lang button"), function(b){
        b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
      });
      var p0 = product(state.lang);
      renderGallery(p0);
      applyLang(state.lang);
      // Reveal the notify panel ~1.2s after first render (subtle; illustrates Activate).
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function reveal(){ state.revealed = true; var box=document.getElementById("notify"); if(box) box.classList.add("is-in"); }
      if (reduce) reveal(); else setTimeout(reveal, 1200);
    }

    fetch("../activate-feed.json")
      .then(function(r){ if(!r.ok) throw new Error("feed "+r.status); return r.json(); })
      .then(function(rows){
        (rows||[]).forEach(function(row){
          if(!row||!row.id) return;
          var l = row.language||"";
          if (/^nl(\b|[-_])/i.test(l) && !byLang.nl[row.id]) byLang.nl[row.id]=row;
          else if (/^en(\b|[-_])/i.test(l) && !byLang.en[row.id]) byLang.en[row.id]=row;
        });
        init();
      })
      .catch(function(){ init(); }); // feed down → placeholders, never errors
  })();
  </script>
</body>
</html>
