<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted marketing/film page for use case 07 (on-site recommendations).
       Reachable only by direct URL; not linked from the shop, not indexed. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Shopler — Recommended for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Shopler design tokens (single source of truth for colour/spacing/type). -->
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* Compact component CSS — tokens only, mirrors the shop's own components. */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);
      font-size:var(--text-base);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    img{max-width:100%}
    .wrap{max-width:var(--container);margin:0 auto;padding:0 var(--space-6)}

    /* ---------- Header (sticky glass) ---------- */
    .hdr{position:sticky;top:0;z-index:40;background:var(--glass);
      -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line)}
    .hdr__row{display:flex;align-items:center;gap:var(--space-6);height:64px}
    .brand{display:inline-flex;align-items:center;gap:var(--space-3);flex:0 0 auto}
    .brand svg{height:30px;width:auto;display:block}
    .brand .wm{font-family:var(--font-display);font-weight:var(--w-bold);font-size:var(--text-lg);
      letter-spacing:var(--track-tight);color:var(--ink);line-height:1}
    .nav{display:flex;gap:var(--space-6);flex:1;font-size:var(--text-sm)}
    .nav a{padding:var(--space-2) 0;border-bottom:2px solid transparent;text-transform:uppercase;
      letter-spacing:var(--track-caps);color:var(--ink-soft)}
    .nav a.is-sale{color:var(--accent)}
    .hdr__actions{display:flex;align-items:center;gap:var(--space-4);flex:0 0 auto}
    .lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
    .lang button{background:transparent;border:0;padding:var(--space-1) var(--space-3);font-size:var(--text-xs);
      font-weight:var(--w-semibold);text-transform:uppercase;color:var(--stone-600);cursor:default}
    .lang button.is-active{background:var(--ink);color:var(--paper)}
    .icon-btn{position:relative;background:transparent;border:0;display:flex;align-items:center;padding:var(--space-1)}
    .icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
    .count{position:absolute;top:-6px;right:-8px;background:var(--accent);color:var(--accent-contrast);
      font-size:10px;font-family:var(--font-mono);min-width:16px;height:16px;border-radius:var(--r-pill);
      display:flex;align-items:center;justify-content:center;padding:0 4px}

    /* ---------- Breadcrumb ---------- */
    .breadcrumb{font-size:var(--text-sm);color:var(--stone-600);padding:var(--space-6) 0 0}

    /* ---------- Shared media block with graceful placeholder ---------- */
    .media{position:relative;aspect-ratio:3/4;background:var(--surface-sunken);
      border-radius:var(--r);overflow:hidden}
    .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .media .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:4px;
      align-items:center;justify-content:center;text-align:center;padding:var(--space-6);
      background:var(--accent-tint);color:var(--stone-600)}
    .media .ph b{font-size:var(--text-xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--stone-400)}
    .media .ph span{font-family:var(--font-display);font-weight:var(--w-semibold);color:var(--ink-soft)}
    .media .packshot{opacity:0;transition:opacity var(--dur) var(--ease)}

    /* ---------- PDP ---------- */
    .pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--space-12);padding-top:var(--space-6)}
    .pdp__gallery{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
    .pdp__brand{font-size:var(--text-sm);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--stone-600)}
    .pdp__info h1{font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-snug);
      font-size:var(--text-xl);margin:var(--space-2) 0}
    .pdp__desc{color:var(--ink-soft);margin:var(--space-3) 0 var(--space-5);max-width:44ch}
    .pdp__colour{font-size:var(--text-sm);color:var(--ink-soft);margin:var(--space-4) 0}
    .pdp__colour b{color:var(--ink);font-weight:var(--w-semibold)}
    .actions{display:flex;gap:var(--space-3);margin:var(--space-5) 0 0}
    .stock{font-size:var(--text-sm);margin:var(--space-4) 0 0;font-weight:var(--w-medium)}
    .stock--in{color:var(--success)} .stock--low{color:var(--accent)} .stock--sold{color:var(--accent)}
    .pdp__meta{border-top:1px solid var(--line);margin-top:var(--space-6);padding-top:var(--space-6);font-size:var(--text-sm)}
    .pdp__meta dl{display:grid;grid-template-columns:130px 1fr;gap:var(--space-2) var(--space-4);margin:0;color:var(--ink-soft)}
    .pdp__meta dt{color:var(--stone-400)}

    /* ---------- Sizes ---------- */
    .sizes{margin:var(--space-5) 0}
    .sizes__label{display:flex;justify-content:space-between;font-size:var(--text-sm);color:var(--ink-soft);margin-bottom:var(--space-3)}
    .sizes__sel{font-weight:var(--w-semibold);color:var(--ink)}
    .sizes__opts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
    .size-opt{min-width:46px;padding:var(--space-2) var(--space-4);border:1px solid var(--stone-300);
      border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:var(--text-sm);cursor:default}
    .size-opt.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    /* ---------- Buttons ---------- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
      border:1px solid var(--accent);background:var(--accent);color:var(--accent-contrast);
      padding:var(--space-3) var(--space-6);border-radius:var(--r-pill);font-family:var(--font-sans);
      font-size:var(--text-sm);font-weight:var(--w-semibold);letter-spacing:var(--track-caps);
      text-transform:uppercase;cursor:default}
    .btn--ghost{background:transparent;color:var(--ink);border-color:var(--stone-300)}
    .btn--block{flex:1}

    /* ---------- Recommendation rail (starts hidden; reveals for the film) ---------- */
    .rail{padding:var(--space-16) 0 var(--space-20);border-top:1px solid var(--line);margin-top:var(--space-16);
      opacity:0;transform:translateY(16px);transition:opacity var(--dur-slow) var(--ease),transform var(--dur-slow) var(--ease)}
    .rail.is-in{opacity:1;transform:none}
    .rail__head h2{font-family:var(--font-display);font-weight:var(--w-bold);letter-spacing:var(--track-snug);
      font-size:var(--text-2xl);margin:0}
    .rail__sub{color:var(--stone-600);margin:var(--space-2) 0 var(--space-8)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-6) var(--space-5)}
    .card__body{padding:var(--space-3) var(--space-1) 0}
    .card__brand{font-size:var(--text-xs);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--stone-400)}
    .card__name{font-size:var(--text-sm);margin:2px 0 var(--space-2);font-weight:var(--w-medium);color:var(--ink)}
    .card:hover .media .packshot{opacity:1}

    /* The rail slide/fade uses its own longer duration for the film; keep it even when
       tokens collapse other motion. Reduced-motion path (below) shows it instantly. */
    .rail{transition-duration:1s}
    @media (prefers-reduced-motion:reduce){
      .rail{transition:none!important;opacity:1;transform:none}
    }

    /* ---------- Responsive ---------- */
    @media(max-width:760px){
      .nav{display:none}
      .pdp{grid-template-columns:1fr;gap:var(--space-8)}
      .pdp__gallery{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,1fr);gap:var(--space-6) var(--space-4)}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <div class="wrap"><div class="hdr__row">
      <a class="brand" href="#" aria-label="Shopler home">
        <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="1.5" y="1.5" width="37" height="37" rx="12" fill="var(--accent)"/>
          <path d="M25.5 14.2c-1.1-1.5-3-2.4-5.4-2.4-3.3 0-5.6 1.7-5.6 4.3 0 2.5 1.9 3.6 5 4.2 2.7.5 3.7 1 3.7 2.2 0 1.2-1.2 2-3.1 2-2 0-3.4-.8-4.4-2.2"
            fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="wm">Shopler</span>
      </a>
      <nav class="nav">
        <a href="#">Women</a>
        <a href="#">Men</a>
        <a href="#">Accessories</a>
        <a href="#" class="is-sale">Sale</a>
      </nav>
      <div class="hdr__actions">
        <div class="lang">
          <button class="is-active">EN</button>
          <button>NL</button>
        </div>
        <button class="icon-btn" aria-label="Bag">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="count">1</span>
        </button>
      </div>
    </div></div>
  </header>

  <main class="wrap">
    <nav class="breadcrumb">Women / Outerwear</nav>
    <section id="pdp" class="pdp"><!-- hero PDP injected here --></section>

    <section id="rail" class="rail" aria-label="Recommendations">
      <div class="rail__head">
        <h2 id="rail-title"></h2>
        <p id="rail-sub" class="rail__sub"></p>
      </div>
      <div id="rail-grid" class="grid"><!-- recommendation cards injected here --></div>
    </section>
  </main>

  <script>
  (function () {
    /* ==== Config — change the featured products here ================= */
    var HERO_SKU  = "AO-W-005";
    var REC_SKUS  = ["AO-W-001", "AO-W-002", "VO-A-003", "VO-A-001"];
    var RAIL_TITLE = "Recommended for you";
    var RAIL_SUB   = "Picked to go with the Wool-blend coat";
    /* ================================================================= */

    var FEED_URL = "../activate-feed.json"; // same-origin; both languages, we keep en-GB
    var SEASON = { AW: "Autumn / Winter", SS: "Spring / Summer", All: "All season" };
    var SIZES = ["XS", "S", "M", "L", "XL"], ACTIVE_SIZE = "M";

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c];
      });
    }
    function seasonLabel(s) { return SEASON[s] || s || ""; }
    function stockLine(p) {
      if (p.in_stock) return { txt: "In stock", cls: "stock--in" };
      if (p.stock > 0) return { txt: "Only " + p.stock + " left", cls: "stock--low" };
      return { txt: "Sold out", cls: "stock--sold" };
    }

    // A media block: lifestyle (main) + packshot (hover), with a graceful placeholder
    // behind them. Any image that fails to load hides itself, revealing the placeholder.
    function mediaHTML(p) {
      var ph = '<div class="ph"><b>' + esc(p ? p.brand : "") + '</b><span>' +
        esc(p ? p.name : "Product") + '</span></div>';
      if (!p) return '<div class="media">' + ph + '</div>';
      var onerr = ' onerror="this.style.display=\'none\'"';
      var life = p.image_lifestyle ? '<img class="lifestyle" src="' + esc(p.image_lifestyle) +
        '" alt="' + esc(p.name) + '"' + onerr + '>' : "";
      var pack = p.image ? '<img class="packshot" src="' + esc(p.image) +
        '" alt=""' + onerr + '>' : "";
      return '<div class="media">' + ph + life + pack + '</div>';
    }

    function renderHero(p, sku) {
      var el = document.getElementById("pdp");
      if (!p) { // missing SKU → tasteful placeholder, no error
        el.innerHTML =
          '<div class="pdp__gallery">' +
            '<div class="media"><div class="ph"><b></b><span>' + esc(sku) + '</span></div></div>' +
            '<div class="media"><div class="ph"><b></b><span>' + esc(sku) + '</span></div></div>' +
          '</div>' +
          '<div class="pdp__info"><div class="pdp__brand"></div><h1>' + esc(sku) + '</h1></div>';
        return;
      }
      var st = stockLine(p);
      var sizeOpts = SIZES.map(function (s) {
        return '<button class="size-opt' + (s === ACTIVE_SIZE ? " is-active" : "") + '">' + esc(s) + '</button>';
      }).join("");
      el.innerHTML =
        '<div class="pdp__gallery">' +
          // 2-up 3:4 imagery: lifestyle first, then packshot
          '<div class="media">' + mediaInner(p, "lifestyle") + '</div>' +
          '<div class="media">' + mediaInner(p, "image") + '</div>' +
        '</div>' +
        '<div class="pdp__info">' +
          '<div class="pdp__brand">' + esc(p.brand) + '</div>' +
          '<h1>' + esc(p.name) + '</h1>' +
          '<p class="pdp__desc">Considered essentials, made to be worn — not just seen.</p>' +
          '<div class="pdp__colour">Colour: <b>' + esc(p.color) + '</b></div>' +
          '<div class="sizes">' +
            '<div class="sizes__label"><span>Size</span><span class="sizes__sel">' + esc(ACTIVE_SIZE) + '</span></div>' +
            '<div class="sizes__opts">' + sizeOpts + '</div>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn btn--block">Add to bag</button>' +
            '<button class="btn btn--ghost">Save</button>' +
          '</div>' +
          '<div class="stock ' + st.cls + '">' + esc(st.txt) + '</div>' +
          '<div class="pdp__meta"><dl>' +
            '<dt>Material</dt><dd>' + esc(p.material) + '</dd>' +
            '<dt>Season</dt><dd>' + esc(seasonLabel(p.season)) + '</dd>' +
          '</dl></div>' +
        '</div>';
    }

    // Single-image gallery cell (placeholder + one image) for the PDP gallery.
    function mediaInner(p, which) {
      var src = which === "lifestyle" ? p.image_lifestyle : p.image;
      var ph = '<div class="ph"><b>' + esc(p.brand) + '</b><span>' + esc(p.name) + '</span></div>';
      var img = src ? '<img src="' + esc(src) + '" alt="' + esc(p.name) +
        '" onerror="this.style.display=\'none\'">' : "";
      return ph + img;
    }

    function cardHTML(p, sku) {
      var body = '<div class="card__body"><div class="card__brand">' + esc(p ? p.brand : "") +
        '</div><div class="card__name">' + esc(p ? p.name : sku) + '</div></div>';
      return '<article class="card">' + mediaHTML(p) + body + '</article>';
    }

    function renderRail(byId) {
      document.getElementById("rail-title").textContent = RAIL_TITLE;
      document.getElementById("rail-sub").textContent = RAIL_SUB;
      var grid = document.getElementById("rail-grid");
      grid.innerHTML = REC_SKUS.map(function (sku) {
        return cardHTML(byId[sku] || null, sku); // missing → placeholder card, never errors
      }).join("");
    }

    // Reveal the rail ~after render, illustrating Activate filling the slot on screen.
    function revealRail() {
      var rail = document.getElementById("rail");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) { rail.classList.add("is-in"); return; }
      setTimeout(function () { rail.classList.add("is-in"); }, 700);
    }

    function build(byId) {
      renderHero(byId[HERO_SKU] || null, HERO_SKU);
      renderRail(byId);
      requestAnimationFrame(revealRail);
    }

    fetch(FEED_URL)
      .then(function (r) { if (!r.ok) throw new Error("feed " + r.status); return r.json(); })
      .then(function (rows) {
        var byId = {};
        (rows || []).forEach(function (row) {
          if (row && row.language === "en-GB" && row.id && !byId[row.id]) byId[row.id] = row;
        });
        build(byId);
      })
      .catch(function () {
        // Feed unavailable → render placeholders so the page never errors on camera.
        build({});
      });
  })();
  </script>
</body>
</html>
